; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; env id kept as esp32-s3-devkitm-1 (not renamed to match the board) so the existing
; per-env sdkconfig file (sdkconfig.esp32-s3-devkitm-1) stays linked and isn't
; regenerated from scratch, discarding the hand-tuned settings in it.
[env:esp32-s3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = nanofoc_d
framework = espidf
board_build.partitions = boards/nano_partitions.csv
