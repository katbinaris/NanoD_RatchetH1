## IDF Component Manager Manifest File
dependencies:
  espressif/esp_tinyusb:
    version: "^2.3.0"
  # LEDs: WS2811 rings over RMT (led_task.c).
  espressif/led_strip:
    version: "^3.0.0"
  # Display: LovyanGFX (replaced esp_lcd_gc9a01 + esp_lvgl_port). Not on the ESP component
  # registry -- pulled from GitHub, pinned to a release tag.
  lovyan03/lovyangfx:
    git: https://github.com/lovyan03/LovyanGFX.git
    version: "1.2.30"
  # Stored app profiles (profile_store.c): LittleFS on the `spiffs` partition, profiles as
  # JSON. IDF 6 no longer bundles cJSON, so both come from the registry.
  joltwallet/littlefs:
    version: "^1.20.0"
  espressif/cjson:
    version: "^1.7.19"
  # WiFi (net.c): the knob's name on the network, <host>.local. Its task is pinned to Core 1
  # (sdkconfig.defaults).
  espressif/mdns:
    version: "^1.8.0"
