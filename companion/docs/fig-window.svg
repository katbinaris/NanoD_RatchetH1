<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Map of the companion window</title>
  <desc>The sidebar with the knob's picture and the pages, the top bar with where you are and one save for everything, and the page with its tabs and controls; amber marks what is chosen or not saved.</desc>
  <rect width="880" height="500" rx="14" fill="#0b0c0d"/>
  <!-- window -->
  <rect x="24" y="24" width="600" height="452" rx="10" fill="#0b0c0d" stroke="#2a2c30"/>
  <!-- sidebar -->
  <rect x="24.5" y="24.5" width="140" height="451" rx="10" fill="#121315"/>
  <rect x="150" y="24.5" width="15" height="451" fill="#121315"/>
  <line x1="164.5" y1="24" x2="164.5" y2="476" stroke="#2a2c30"/>
  <circle cx="40" cy="38" r="4" fill="#ff5f57"/><circle cx="52" cy="38" r="4" fill="#febc2e"/><circle cx="64" cy="38" r="4" fill="#28c840"/>
  <rect x="64" y="52" width="60" height="78" rx="6" fill="#26272b" stroke="#3a3b3f"/>
  <circle cx="94" cy="84" r="22" fill="#000" stroke="#3a3b3f" stroke-width="3"/>
  <rect x="89" y="76" width="10" height="10" fill="#ff7a2f"/>
  <rect x="70" y="112" width="11" height="11" rx="2" fill="#2f3034"/><rect x="83" y="112" width="11" height="11" rx="2" fill="#55575c"/><rect x="96" y="112" width="11" height="11" rx="2" fill="#c9c9cc"/><rect x="109" y="112" width="11" height="11" rx="2" fill="#e08a46"/>
  <text x="94" y="148" fill="#ececec" text-anchor="middle" font-weight="600">Quadra 7142</text>
  <circle cx="68" cy="160" r="3" fill="#5ad17a"/><text x="76" y="164" fill="#9a9ca3" font-size="10">USB · 2.0.0</text>
  <line x1="24" y1="176.5" x2="164" y2="176.5" stroke="#2a2c30"/>
  <text x="36" y="196" fill="#9a9ca3" font-size="9" font-weight="600" letter-spacing=".6">KNOB</text>
  <rect x="32" y="203" width="124" height="20" rx="5" fill="#24262a"/>
  <text x="42" y="217" fill="#ececec">Mode</text><text x="146" y="217" fill="#62646b" font-size="10" text-anchor="end">App</text>
  <text x="42" y="239" fill="#9a9ca3">Haptics</text><circle cx="146" cy="235" r="3" fill="#ffc94d"/>
  <text x="36" y="262" fill="#9a9ca3" font-size="9" font-weight="600" letter-spacing=".6">APP PROFILES</text>
  <rect x="42" y="271" width="10" height="10" rx="2" fill="#ff7a2f" stroke="#5ad17a" stroke-width="1.5"/><text x="58" y="280" fill="#9a9ca3">Plasticity</text>
  <rect x="42" y="291" width="10" height="10" rx="2" fill="#9747ff"/><text x="58" y="300" fill="#9a9ca3">Figma</text><circle cx="146" cy="296" r="3" fill="#ffc94d"/>
  <rect x="42" y="311" width="10" height="10" rx="2" fill="#2f9bff"/><text x="58" y="320" fill="#9a9ca3">Onshape</text>
  <text x="42" y="340" fill="#9a9ca3">+ New profile</text>
  <text x="36" y="364" fill="#9a9ca3" font-size="9" font-weight="600" letter-spacing=".6">SETUP</text>
  <text x="42" y="384" fill="#9a9ca3">Look</text><text x="42" y="404" fill="#9a9ca3">Device</text><text x="42" y="424" fill="#9a9ca3">System info</text>
  <!-- top bar -->
  <line x1="165" y1="58.5" x2="624" y2="58.5" stroke="#2a2c30"/>
  <text x="182" y="45" fill="#9a9ca3">Knob ›</text><text x="222" y="45" fill="#ececec" font-weight="500">Mode</text>
  <rect x="384" y="32" width="128" height="20" rx="5" fill="#2c2716"/><circle cx="394" cy="42" r="3" fill="#ffc94d"/><text x="402" y="46" fill="#ffc94d" font-size="11">2 unsaved: Haptics…</text>
  <rect x="518" y="32" width="96" height="20" rx="5" fill="#ffc94d"/><text x="566" y="46" fill="#15120a" font-size="11" font-weight="500" text-anchor="middle">Save to knob</text>
  <!-- page -->
  <text x="184" y="88" fill="#ececec" font-size="16" font-weight="600">Mode</text>
  <text x="184" y="104" fill="#9a9ca3" font-size="10">What the knob sends to the computer</text>
  <rect x="184" y="116" width="98" height="44" rx="7" fill="#1a1b1e" stroke="#ffc94d" stroke-width="1.5"/><text x="194" y="134" fill="#ececec" font-weight="600">App</text><text x="194" y="150" fill="#ffc94d" font-size="10">App profiles</text>
  <rect x="290" y="116" width="98" height="44" rx="7" fill="#1a1b1e" stroke="#2a2c30"/><text x="300" y="134" fill="#ececec" font-weight="600">Mouse</text>
  <rect x="396" y="116" width="98" height="44" rx="7" fill="#1a1b1e" stroke="#2a2c30"/><text x="406" y="134" fill="#ececec" font-weight="600">Keys</text>
  <rect x="502" y="116" width="104" height="44" rx="7" fill="#1a1b1e" stroke="#2a2c30"/><text x="512" y="134" fill="#ececec" font-weight="600">MIDI</text>
  <rect x="184" y="172" width="422" height="140" rx="9" fill="#121315" stroke="#2a2c30"/>
  <text x="198" y="194" fill="#ececec" font-weight="600">Profile in use</text>
  <rect x="198" y="206" width="88" height="86" rx="7" fill="#1a1b1e" stroke="#ffc94d" stroke-width="1.5"/><rect x="230" y="218" width="24" height="24" fill="#ff7a2f"/><text x="242" y="262" fill="#ececec" font-size="11" text-anchor="middle" font-weight="600">Plasticity</text>
  <rect x="294" y="206" width="88" height="86" rx="7" fill="#1a1b1e" stroke="#2a2c30"/><rect x="326" y="218" width="24" height="24" fill="#9747ff"/><text x="338" y="262" fill="#ececec" font-size="11" text-anchor="middle" font-weight="600">Figma</text>
  <rect x="390" y="206" width="88" height="86" rx="7" fill="#1a1b1e" stroke="#2a2c30"/><rect x="422" y="218" width="24" height="24" fill="#2f9bff"/><text x="434" y="262" fill="#ececec" font-size="11" text-anchor="middle" font-weight="600">Onshape</text>
  <rect x="184" y="324" width="422" height="134" rx="9" fill="#121315" stroke="#2a2c30"/>
  <text x="198" y="346" fill="#ececec" font-weight="600">Haptics in App mode</text>
  <rect x="198" y="358" width="300" height="6" rx="3" fill="#24262a"/><rect x="198" y="374" width="250" height="6" rx="3" fill="#24262a"/>
  <!-- callouts -->
  <g fill="#ffc94d" font-weight="600" font-size="11">
    <circle cx="94" cy="58" r="9" fill="#ffc94d"/><text x="94" y="62" fill="#15120a" text-anchor="middle">1</text>
    <circle cx="150" cy="192" r="9"/><text x="150" y="196" fill="#15120a" text-anchor="middle">2</text>
    <circle cx="300" cy="42" r="9"/><text x="300" y="46" fill="#15120a" text-anchor="middle">3</text>
    <circle cx="600" cy="68" r="9"/><text x="600" y="72" fill="#15120a" text-anchor="middle">4</text>
    <circle cx="612" cy="184" r="9"/><text x="612" y="188" fill="#15120a" text-anchor="middle">5</text>
  </g>
  <!-- legend -->
  <g font-size="12">
    <text x="648" y="60" fill="#ececec" font-weight="600">1  Your knob</text>
    <text x="648" y="78" fill="#9a9ca3">What its screen shows now,</text>
    <text x="648" y="94" fill="#9a9ca3">and how it's connected</text>
    <text x="648" y="128" fill="#ececec" font-weight="600">2  Pages</text>
    <text x="648" y="146" fill="#9a9ca3">Knob, app profiles, setup.</text>
    <text x="648" y="162" fill="#9a9ca3">Green ring: the profile in use</text>
    <text x="648" y="196" fill="#ececec" font-weight="600">3  Where you are</text>
    <text x="648" y="230" fill="#ececec" font-weight="600">4  One save</text>
    <text x="648" y="248" fill="#9a9ca3">Settings, lights and profiles.</text>
    <text x="648" y="264" fill="#9a9ca3">The amber label lists what</text>
    <text x="648" y="280" fill="#9a9ca3">isn't saved yet</text>
    <text x="648" y="314" fill="#ececec" font-weight="600">5  The page</text>
    <text x="648" y="332" fill="#9a9ca3">Some have tabs. Amber marks</text>
    <text x="648" y="348" fill="#9a9ca3">the choice; an amber dot, a</text>
    <text x="648" y="364" fill="#9a9ca3">change not saved yet</text>
  </g>
</svg>
