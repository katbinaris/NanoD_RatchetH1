<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Live first, stored when you save</title>
  <desc>A change goes live on the knob at once; Save to knob stores it; Revert goes back to what is stored. The same for settings, lights and app profiles.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a9ca3"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffc94d"/></marker></defs>
  <rect width="880" height="300" rx="14" fill="#0b0c0d"/>
  <text x="32" y="44" fill="#ececec" font-size="16" font-weight="600">Changes are live first, and stored when you save</text>
  <text x="32" y="66" fill="#9a9ca3">The same for every setting, the lights and app profiles</text>
  <rect x="32" y="96" width="220" height="116" rx="12" fill="#121315" stroke="#2a2c30"/>
  <text x="50" y="124" fill="#ececec" font-weight="600">You change something</text>
  <text x="50" y="148" fill="#9a9ca3">A slider, a card, a profile's</text>
  <text x="50" y="166" fill="#9a9ca3">field, in the app</text>
  <rect x="330" y="96" width="220" height="116" rx="12" fill="#121315" stroke="#ffc94d"/>
  <text x="348" y="124" fill="#ececec" font-weight="600">Live on the knob</text>
  <text x="348" y="148" fill="#9a9ca3">You feel it at once.</text>
  <text x="348" y="166" fill="#9a9ca3">Listed as unsaved, amber.</text>
  <text x="348" y="192" fill="#ffc94d">Lost at power-off</text>
  <rect x="628" y="96" width="220" height="116" rx="12" fill="#121315" stroke="#2a2c30"/>
  <text x="646" y="124" fill="#ececec" font-weight="600">Stored</text>
  <text x="646" y="148" fill="#9a9ca3">In the knob's flash. Kept after</text>
  <text x="646" y="166" fill="#9a9ca3">a restart, with no app running</text>
  <line x1="256" y1="154" x2="324" y2="154" stroke="#9a9ca3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="290" y="144" fill="#9a9ca3" text-anchor="middle" font-size="11">at once</text>
  <line x1="554" y1="140" x2="622" y2="140" stroke="#ffc94d" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="548" y="100" width="80" height="22" rx="5" fill="#ffc94d"/><text x="588" y="115" fill="#15120a" text-anchor="middle" font-size="11" font-weight="500">Save to knob</text>
  <text x="588" y="164" fill="#9a9ca3" text-anchor="middle" font-size="11">or F2 on</text><text x="588" y="178" fill="#9a9ca3" text-anchor="middle" font-size="11">the knob</text>
  <path d="M738 216 C738 262 440 262 440 220" fill="none" stroke="#9a9ca3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="589" y="276" fill="#9a9ca3" text-anchor="middle">Revert: back to what's stored</text>
</svg>
