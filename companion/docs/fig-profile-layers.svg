<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>A profile's layers</title>
  <desc>A live edit over a stored copy over the built-in; the knob uses the top one there is. Save to knob makes the live edit the stored copy, Revert drops the live edit, Reset to default deletes the stored copy.</desc>
  <rect width="880" height="320" rx="14" fill="#0b0c0d"/>
  <text x="32" y="44" fill="#ececec" font-size="16" font-weight="600">One profile, up to three layers</text>
  <text x="32" y="66" fill="#9a9ca3">The knob uses the top one there is</text>
  <rect x="32" y="90" width="430" height="58" rx="10" fill="#121315" stroke="#ffc94d"/>
  <text x="50" y="114" fill="#ececec" font-weight="600">Live edit</text><text x="50" y="134" fill="#9a9ca3">What the app sent last. In memory only.</text>
  <rect x="368" y="106" width="80" height="22" rx="11" fill="#2c2716"/><text x="408" y="121" fill="#ffc94d" text-anchor="middle" font-size="11">Not saved</text>
  <rect x="32" y="158" width="430" height="58" rx="10" fill="#121315" stroke="#2a2c30"/>
  <text x="50" y="182" fill="#ececec" font-weight="600">Stored copy</text><text x="50" y="202" fill="#9a9ca3">A file in the knob's flash. Survives power-off.</text>
  <rect x="32" y="226" width="430" height="58" rx="10" fill="#121315" stroke="#2a2c30" stroke-dasharray="4 4"/>
  <text x="50" y="250" fill="#ececec" font-weight="600">Built-in</text><text x="50" y="270" fill="#9a9ca3">Part of the firmware. Never changes.</text>
  <g font-size="13">
    <rect x="500" y="96" width="96" height="24" rx="6" fill="#ffc94d"/><text x="548" y="112" fill="#15120a" text-anchor="middle" font-size="12" font-weight="500">Save to knob</text>
    <text x="610" y="113" fill="#9a9ca3">the live edit becomes the stored copy</text>
    <rect x="500" y="134" width="96" height="24" rx="6" fill="#1a1b1e" stroke="#2a2c30"/><text x="548" y="150" fill="#ececec" text-anchor="middle" font-size="12" font-weight="500">Revert</text>
    <text x="610" y="151" fill="#9a9ca3">drops the live edit</text>
    <rect x="500" y="172" width="120" height="24" rx="6" fill="none" stroke="#4a2a28"/><text x="560" y="188" fill="#ff6b5a" text-anchor="middle" font-size="12" font-weight="500">Reset to default</text>
    <text x="634" y="189" fill="#9a9ca3">deletes it: the built-in shows again</text>
    <text x="500" y="236" fill="#9a9ca3">Save to knob and Revert are in the top bar;</text>
    <text x="500" y="254" fill="#9a9ca3">Reset to default is on the profile's General tab.</text>
    <text x="500" y="282" fill="#9a9ca3">Your own profiles have no built-in layer:</text>
    <text x="500" y="300" fill="#9a9ca3">there the button is Delete profile.</text>
  </g>
</svg>
