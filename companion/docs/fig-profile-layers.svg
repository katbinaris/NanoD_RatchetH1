<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" shape-rendering="crispEdges">
  <rect width="880" height="330" fill="#000"/>
  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffc94d"/></marker>
    <marker id="pg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker>
  </defs>

  <text x="40" y="36" fill="#fff" font-size="14" font-weight="bold">ONE PROFILE, UP TO THREE LAYERS</text>
  <text x="40" y="56" fill="#777" font-size="10">THE KNOB USES THE TOP ONE THAT EXISTS</text>

  <!-- layers, top first -->
  <rect x="40" y="84" width="420" height="60" fill="none" stroke="#ffc94d" stroke-width="2"/>
  <text x="56" y="108" fill="#ffc94d" font-weight="bold">LIVE EDIT</text>
  <text x="56" y="130" fill="#aaa" font-size="10">WHAT THE EDITOR SENT LAST. IN MEMORY ONLY.</text>
  <text x="376" y="108" fill="#ffc94d" font-size="10">NOT SAVED</text>

  <rect x="40" y="160" width="420" height="60" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="56" y="184" fill="#fff" font-weight="bold">STORED COPY</text>
  <text x="56" y="206" fill="#aaa" font-size="10">A FILE IN THE KNOB'S FLASH. SURVIVES POWER-OFF.</text>

  <rect x="40" y="236" width="420" height="60" fill="none" stroke="#666" stroke-width="2"/>
  <text x="56" y="260" fill="#aaa" font-weight="bold">BUILT-IN</text>
  <text x="56" y="282" fill="#777" font-size="10">PART OF THE FIRMWARE. NEVER CHANGES.</text>

  <!-- actions -->
  <polyline points="460,114 520,114 520,186 466,186" fill="none" stroke="#ffc94d" stroke-width="2" marker-end="url(#pa)"/>
  <text x="534" y="146" fill="#ffc94d" font-weight="bold">SAVE TO KNOB</text>
  <text x="534" y="162" fill="#777" font-size="10">LIVE EDIT BECOMES THE STORED COPY</text>

  <polyline points="460,98 500,98 500,74" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pg)"/>
  <text x="514" y="84" fill="#aaa" font-weight="bold">REVERT</text>
  <text x="514" y="100" fill="#777" font-size="10">DROPS THE LIVE EDIT</text>

  <polyline points="460,204 500,204 500,250" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pg)"/>
  <text x="514" y="226" fill="#aaa" font-weight="bold">RESET TO DEFAULT</text>
  <text x="514" y="242" fill="#777" font-size="10">DELETES IT: THE BUILT-IN SHOWS AGAIN</text>

  <text x="514" y="282" fill="#777" font-size="10">YOUR OWN PROFILES HAVE NO BUILT-IN LAYER:</text>
  <text x="514" y="298" fill="#777" font-size="10">THERE THE BUTTON IS DELETE PROFILE.</text>
</svg>
