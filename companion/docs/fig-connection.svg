<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>How the companion reaches the knob</title>
  <desc>The app and the web page share one UI and protocol, and reach the knob over its vendor HID interface; the app also over Wi-Fi once paired.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9ca3"/></marker></defs>
  <rect width="880" height="330" rx="14" fill="#0b0c0d"/>
  <rect x="24" y="24" width="470" height="282" rx="12" fill="#121315" stroke="#2a2c30"/>
  <text x="44" y="52" fill="#ececec" font-size="15" font-weight="600">The computer</text>
  <rect x="44" y="68" width="430" height="64" rx="9" fill="#1a1b1e" stroke="#2a2c30"/>
  <text x="62" y="94" fill="#ececec" font-weight="600">The same UI and protocol (TypeScript, Preact)</text>
  <text x="62" y="116" fill="#9a9ca3">Pages, the profile editor, proto.ts</text>
  <rect x="44" y="146" width="208" height="140" rx="9" fill="#1a1b1e" stroke="#2a2c30"/>
  <text x="62" y="172" fill="#ececec" font-weight="600">Quadra app</text>
  <text x="62" y="194" fill="#9a9ca3">Tauri, Rust, hidapi</text>
  <text x="62" y="214" fill="#9a9ca3">Finds the knob itself</text>
  <text x="62" y="234" fill="#9a9ca3">Wi-Fi once paired:</text>
  <text x="62" y="252" fill="#9a9ca3">encrypted, port 3333</text>
  <rect x="266" y="146" width="208" height="140" rx="9" fill="#1a1b1e" stroke="#2a2c30"/>
  <text x="284" y="172" fill="#ececec" font-weight="600">Web page</text>
  <text x="284" y="194" fill="#9a9ca3">Chrome or Edge, WebHID</text>
  <text x="284" y="214" fill="#9a9ca3">Connect once, then</text>
  <text x="284" y="232" fill="#9a9ca3">automatic</text>
  <line x1="500" y1="166" x2="626" y2="166" stroke="#9a9ca3" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="563" y="152" fill="#ececec" text-anchor="middle" font-size="12" font-weight="500">USB, vendor HID</text>
  <text x="563" y="186" fill="#9a9ca3" text-anchor="middle" font-size="11">64-byte reports</text>
  <text x="563" y="202" fill="#9a9ca3" text-anchor="middle" font-size="11">no driver, no macOS</text>
  <text x="563" y="216" fill="#9a9ca3" text-anchor="middle" font-size="11">permission prompt</text>
  <rect x="632" y="24" width="224" height="282" rx="12" fill="#121315" stroke="#2a2c30"/>
  <text x="652" y="52" fill="#ececec" font-size="15" font-weight="600">The knob</text>
  <g font-size="12" fill="#9a9ca3">
    <text x="652" y="88">Settings</text><text x="836" y="88" text-anchor="end">⇄</text>
    <text x="652" y="114">App profiles, icons</text><text x="836" y="114" text-anchor="end">⇄</text>
    <text x="652" y="140">Lights, idle word, clock</text><text x="836" y="140" text-anchor="end">⇄</text>
    <text x="652" y="166">Wi-Fi status</text><text x="836" y="166" text-anchor="end">→</text>
    <text x="652" y="192">System info, twice a</text><text x="836" y="192" text-anchor="end">→</text>
    <text x="652" y="208">second, while it's open</text>
  </g>
</svg>
