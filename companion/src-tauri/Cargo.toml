[package]
name = "quadra-companion"
version = "0.1.0"
description = "Desktop companion for the Quadra haptic knob"
edition = "2021"

[lib]
name = "quadra_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
